    - vix_level
    - turbulence_index
    - absorption_ratio
  supervised:
    - random_forest

# ---------------------------------------------------------------------------
# Experiment presets — select methods + crisis subset for common run profiles
# ---------------------------------------------------------------------------
experiments:
  default:
    methods:
      - berry_phase_rate
      - qfi_determinant
      - multi_lag_fidelity
      - qcml_chern
      - geometric_consensus
      - spectral_gap
      - metric_condition
      - geometric_ensemble
      - rolling_vol_z
      - cusum
      - hmm
      # - bocpd          # O(T^2) — too slow for 12-crisis sweep, d≈0.02 on all crises
      - isolation_forest
      - random_forest
    crisis_subset: post_2005

  quick:
    methods:
      - berry_phase_rate
      - qfi_determinant
      - multi_lag_fidelity
      - rolling_vol_z
      - random_forest
