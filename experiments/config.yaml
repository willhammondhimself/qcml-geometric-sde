# ---------------------------------------------------------------------------
# Geometric (QCML) detectors
# ---------------------------------------------------------------------------
detectors:
  berry_phase_rate:
    class: qcml_geometry.BerryPhaseRateDetector
    display_name: "Berry Phase Rate"
    params:
      hilbert_dim: 6
      n_pca_components: 8
      rolling_window: 15
      operator_method: random
      seed: 42
      normalization: sphere
      berry_aggregation: f01
    hpo_source: "normalization_ablation_20260223"

  qfi_determinant:
    class: qcml_geometry.QFIDeterminantDetector
    display_name: "QFI Determinant"
    params:
      hilbert_dim: 8
      n_pca_components: 15
      rolling_window: 20
      operator_method: pca_inspired
      seed: 42
      normalization: soft
      qfi_mode: logdet
      adaptive_epsilon: true
    hpo_source: "normalization_ablation_20260223"

  multi_lag_fidelity:
    class: qcml_geometry.MultiLagFidelityDetector
    display_name: "Multi-Lag Fidelity"
    params:
      hilbert_dim: 4
      n_pca_components: 8
      rolling_window: 20
      operator_method: pca_inspired
      seed: 42
      normalization: sphere
    hpo_source: "normalization_ablation_20260223"

  qcml_chern:
    class: experiments.additional_detectors.QCMLChernDetector
    display_name: "QCML Chern"
    params:
      hilbert_dim: 8
      n_pca_components: 15
      operator_method: random
      seed: 42
      normalization: soft
    hpo_source: "normalization_ablation_20260223"

  geometric_consensus:
    class: experiments.additional_detectors.GeometricConsensusDetector
    display_name: "Geometric Consensus"
    params:
      hilbert_dim: 8
      n_pca_components: 15
      operator_method: random
      seed: 42
      normalization: soft
    hpo_source: "normalization_ablation_20260223"

  spectral_gap:
    class: qcml_geometry.SpectralGapDetector
    display_name: "Spectral Gap"
    params:
      hilbert_dim: 16
      n_pca_components: 15
      rolling_window: 20
      operator_method: random
      seed: 42
      normalization: soft
      adaptive_epsilon: true
    hpo_source: "pipeline_upgrade_v2"

  metric_condition:
    class: qcml_geometry.MetricConditionDetector
    display_name: "Metric Condition"
    params:
      hilbert_dim: 16
      n_pca_components: 15
      rolling_window: 20
      operator_method: random
      seed: 42
      normalization: soft
      adaptive_epsilon: true
    hpo_source: "pipeline_upgrade_v2"

  geometric_ensemble:
    class: qcml_geometry.GeometricEnsembleDetector
    display_name: "Geometric Ensemble"
    params:
      hilbert_dim: 8
      n_pca_components: 15
      rolling_window: 20
      operator_method: random
      seed: 42
      normalization: sphere
    hpo_source: "normalization_ablation_20260223"

  # --- New geometric detectors (Workstream A) ---
  geodesic_velocity:
    class: qcml_geometry.GeodesicVelocityDetector
    display_name: "Geodesic Velocity"
    params:
      hilbert_dim: 16
      n_pca_components: 8
      rolling_window: 15
      operator_method: pca_inspired
      seed: 42
      normalization: soft
    hpo_source: "pipeline_upgrade_v2"

  spectral_flow:
    class: qcml_geometry.SpectralFlowDetector
    display_name: "Spectral Flow"
    params:
      hilbert_dim: 16
      n_pca_components: 8
      rolling_window: 15
      operator_method: pca_inspired
      seed: 42
      normalization: soft
      adaptive_epsilon: true
    hpo_source: "pipeline_upgrade_v2"

  commutator_norm:
    class: qcml_geometry.CommutatorNormDetector
    display_name: "Commutator Norm"
    params:
      hilbert_dim: 16
      n_pca_components: 8
      rolling_window: 15
      operator_method: pca_inspired
      seed: 42
      normalization: soft
      adaptive_epsilon: true
    hpo_source: "pipeline_upgrade_v2"

  ricci_scalar:
    class: qcml_geometry.RicciScalarDetector
    display_name: "Ricci Scalar"
    params:
      hilbert_dim: 16
      n_pca_components: 3
      rolling_window: 20
      operator_method: pca_inspired
      seed: 42
      normalization: soft
      adaptive_epsilon: true
    hpo_source: "pipeline_upgrade_v2"

  sectional_curvature:
    class: qcml_geometry.SectionalCurvatureDetector
    display_name: "Sectional Curvature"
    params:
      hilbert_dim: 16
      n_pca_components: 3
      rolling_window: 20
      operator_method: pca_inspired
      seed: 42
      normalization: soft
      adaptive_epsilon: true
    hpo_source: "pipeline_upgrade_v2"

  # --- Observatory expansion detectors (Feb 2026 sprint) ---
  speed_limit_ratio:
    class: qcml_geometry.SpeedLimitRatioDetector
    display_name: "Speed Limit Ratio"
    params:
      hilbert_dim: 16
      n_pca_components: 8
      rolling_window: 20
      operator_method: random
      seed: 42
      normalization: soft
