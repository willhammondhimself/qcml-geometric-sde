      - geometric_consensus
      - spectral_gap
      - metric_condition
      - geometric_ensemble
      - speed_limit_ratio
      - dimensionality_collapse
      - sectional_curvature_sign
      - geodesic_velocity
      - spectral_entropy
      - hamiltonian_sensitivity
      - reduced_purity
      - effective_state_dim
      - spectral_complexity
      - geometric_phase_rate
      - geodesic_curvature
      - qgt_phase_rigidity
      - berry_velocity_coupling
      - curvature_rate
      - spectral_flow
      - commutator_norm
      - ricci_scalar
      - sectional_curvature
      - level_spacing_ratio
      - quantum_relative_entropy
      # Info geometry
      - fisher_rao
