    params:
      hilbert_dim: 16
      n_pca_components: 3
      operator_method: pca_inspired
      seed: 42
      normalization: soft
      adaptive_epsilon: true
      score_mode: neg_fraction
      neg_fraction_window: 20
      subsample: 10
    hpo_source: "pipeline_upgrade_v2"

  # --- New observatory expansion (Mar 2026) ---
  spectral_entropy:
    class: qcml_geometry.SpectralEntropyDetector
    display_name: "Spectral Entropy"
    params:
      hilbert_dim: 8
      n_pca_components: 8
      rolling_window: 20
      operator_method: random
      seed: 42
      normalization: soft
      adaptive_epsilon: true
    hpo_source: "observatory_expansion_20260303"

  geometric_phase_rate:
    class: qcml_geometry.GeometricPhaseRateDetector
    display_name: "Geometric Phase Rate"
    params:
      hilbert_dim: 6
      n_pca_components: 8
      rolling_window: 15
      operator_method: random
      seed: 42
      normalization: sphere
    hpo_source: "observatory_expansion_20260303"

  hamiltonian_sensitivity:
    class: qcml_geometry.HamiltonianSensitivityDetector
    display_name: "Hamiltonian Sensitivity"
    params:
      hilbert_dim: 16
      n_pca_components: 8
      rolling_window: 20
      operator_method: random
      seed: 42
      normalization: soft
      adaptive_epsilon: true
    hpo_source: "pipeline_upgrade_v2"

  geodesic_curvature:
    class: qcml_geometry.GeodesicCurvatureDetector
    display_name: "Geodesic Curvature"
    params:
      hilbert_dim: 16
      n_pca_components: 3
      operator_method: pca_inspired
      seed: 42
      normalization: soft
      adaptive_epsilon: true
      subsample: 5
    hpo_source: "pipeline_upgrade_v2"

  effective_state_dim:
    class: qcml_geometry.EffectiveStateDimensionDetector
    display_name: "Effective State Dim"
    params:
      hilbert_dim: 16
      n_pca_components: 8
      rolling_window: 20
      operator_method: random
      seed: 42
      normalization: soft
      adaptive_epsilon: true
    hpo_source: "pipeline_upgrade_v2"

  qgt_phase_rigidity:
    class: qcml_geometry.QGTPhaseRigidityDetector
    display_name: "QGT Phase Rigidity"
    params:
      hilbert_dim: 16
      n_pca_components: 8
      rolling_window: 20
      operator_method: random
      seed: 42
      normalization: soft
      adaptive_epsilon: true
    hpo_source: "pipeline_upgrade_v2"

  reduced_purity:
    class: qcml_geometry.ReducedPurityDetector
    display_name: "Reduced Purity"
    params:
      hilbert_dim: 8
      n_pca_components: 8
      rolling_window: 20
      operator_method: random
      seed: 42
      normalization: soft
      adaptive_epsilon: true
      partition: [2, 4]
    hpo_source: "observatory_expansion_20260303"

  spectral_complexity:
    class: qcml_geometry.SpectralComplexityDetector
    display_name: "Spectral Complexity"
    params:
      hilbert_dim: 16
      n_pca_components: 8
      rolling_window: 20
      operator_method: random
      seed: 42
      normalization: soft
      adaptive_epsilon: true
    hpo_source: "pipeline_upgrade_v2"

  berry_velocity_coupling:
    class: qcml_geometry.BerryVelocityCouplingDetector
    display_name: "Berry Velocity Coupling"
    params:
      hilbert_dim: 6
      n_pca_components: 8
      rolling_window: 15
      operator_method: random
      seed: 42
      normalization: sphere
    hpo_source: "observatory_expansion_20260303"

  curvature_rate:
    class: qcml_geometry.CurvatureRateDetector
    display_name: "Curvature Rate"
    params:
      hilbert_dim: 16
      n_pca_components: 3
      operator_method: pca_inspired
      seed: 42
      normalization: soft
      adaptive_epsilon: true
      subsample: 5
    hpo_source: "pipeline_upgrade_v2"

  level_spacing_ratio:
    class: qcml_geometry.LevelSpacingRatioDetector
    display_name: "Level Spacing Ratio"
    params:
      hilbert_dim: 8
      n_pca_components: 8
      operator_method: random
      seed: 42
      normalization: soft
      adaptive_epsilon: true
      variant: mean_ratio
      poisson_threshold: 0.386
    hpo_source: "ideation_0123_full_benchmark"

  quantum_relative_entropy:
    class: qcml_geometry.QuantumRelativeEntropyDetector
    display_name: "Quantum Relative Entropy"
    params:
      hilbert_dim: 8
      n_pca_components: 8
      operator_method: random
      seed: 42
      normalization: soft
      adaptive_epsilon: true
      state_window: 20
    hpo_source: "ideation_0127_smoke"

# ---------------------------------------------------------------------------
# Information geometry detectors (Workstream B)
# ---------------------------------------------------------------------------
info_geometry:
  fisher_rao:
    class: qcml_geometry.info_geometry.FisherRaoDetector
    display_name: "Fisher-Rao"
    params:
      window: 30
      lag: 10
      rolling_window: 15
      min_expanding: 60
      seed: 42
    hpo_source: "initial_defaults"

  wasserstein:
    class: qcml_geometry.info_geometry.WassersteinDetector
    display_name: "Wasserstein"
    params:
      window: 30
      lag: 10
      rolling_window: 15
      min_expanding: 60
      n_projections: 20
      seed: 42
    hpo_source: "initial_defaults"

  kl_divergence:
    class: qcml_geometry.info_geometry.KLDivergenceDetector
    display_name: "KL Divergence"
    params:
      window: 30
      lag: 10
      rolling_window: 15
      min_expanding: 60
      n_bins: 30
      seed: 42
    hpo_source: "initial_defaults"

  sinkhorn:
    class: qcml_geometry.info_geometry.SinkhornDetector
    display_name: "Sinkhorn"
    params:
      window: 30
      lag: 10
      rolling_window: 15
      min_expanding: 60
      reg: 0.1
      seed: 42
    hpo_source: "initial_defaults"

# ---------------------------------------------------------------------------
# Classical and supervised baselines
# ---------------------------------------------------------------------------
baselines:
  rolling_vol_z:
    class: experiments.baselines.RollingVolatilityDetector
    display_name: "Rolling Vol Z"
    params:
      vol_window: 20
      min_expanding: 60
    supervised: false

  cusum:
    class: experiments.baselines.CUSUMDetector
    display_name: "CUSUM"
    params:
      burn_in: 60
    supervised: false

  hmm:
    class: experiments.baselines.HMMRegimeDetector
    display_name: "HMM"
    params:
      n_iter: 100
      seed: 42
    supervised: false

  bocpd:
    class: experiments.baselines.BOCPDDetector
    display_name: "BOCPD"
    params:
      hazard_rate: 250.0
    supervised: false

  isolation_forest:
    class: experiments.baselines.IsolationForestDetector
    display_name: "Isolation Forest"
    params:
      n_estimators: 100
      seed: 42
    supervised: false

  random_forest:
    class: experiments.baselines.RandomForestRegimeDetector
    display_name: "Random Forest"
    params:
      n_estimators: 200
      max_depth: 6
      seed: 42
      lookback: 20
    supervised: true
    evaluation: leave_one_crisis_out

  # --- New baselines (Mar 2026) ---
  garch:
    class: experiments.baselines.GARCHDetector
    display_name: "GARCH(1,1)"
    params:
      min_expanding: 60
    supervised: false

  hamilton_ms:
    class: experiments.baselines.HamiltonMSDetector
    display_name: "Hamilton MS"
    params:
      k_regimes: 2
      order: 1
      min_history: 100
    supervised: false

  ewma_vol:
    class: experiments.baselines.EWMADetector
    display_name: "EWMA Vol"
    params:
      decay: 0.94
      min_expanding: 60
    supervised: false

  mahalanobis:
    class: experiments.baselines.MahalanobisDetector
    display_name: "Mahalanobis"
    params:
      min_expanding: 60
      regularization: 1.0e-6
    supervised: false

  structural_break:
    class: experiments.baselines.StructuralBreakDetector
    display_name: "Structural Break"
    params:
      model: rbf
      penalty: 3.0
      min_expanding: 60
    supervised: false

  transfer_entropy:
    class: experiments.baselines.TransferEntropyDetector
    display_name: "Transfer Entropy"
    params:
      te_window: 60
      n_bins: 5
      lag: 1
      min_expanding: 60
    supervised: false

  vix_level:
    class: experiments.baselines.VIXThresholdDetector
    display_name: "VIX Level"
    params:
      min_expanding: 60
    supervised: false

  turbulence_index:
    class: experiments.baselines.TurbulenceIndexDetector
    display_name: "Turbulence Index"
    params:
      rolling_window: 252
      min_expanding: 60
      regularization: 1.0e-6
    supervised: false

  absorption_ratio:
    class: experiments.baselines.AbsorptionRatioDetector
    display_name: "Absorption Ratio"
    params:
      rolling_window: 252
      n_components: 1
      min_expanding: 60
    supervised: false

# ---------------------------------------------------------------------------
# Evaluation protocol
# ---------------------------------------------------------------------------
evaluation:
  window_size: 10             # rolling window for Cohen's d computation
  n_bootstrap: 10000          # bootstrap resamples for CIs
  seed: 42
  min_pre_crisis_rows: 100    # minimum rows before crisis start
  persistence_filter: 3       # consecutive-day persistence threshold
  significance_alpha: 0.05    # Holm-Bonferroni family-wise alpha

# ---------------------------------------------------------------------------
# Method category groupings — used for aggregate statistics and tables
# ---------------------------------------------------------------------------
method_categories:
  geometric:
    - berry_phase_rate
    - qfi_determinant
