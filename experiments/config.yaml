    - geometric_phase_rate
    - hamiltonian_sensitivity
    - geodesic_curvature
    - effective_state_dim
    - qgt_phase_rigidity
    - reduced_purity
    - spectral_complexity
    - berry_velocity_coupling
    - curvature_rate
    - level_spacing_ratio
    - quantum_relative_entropy
  info_geometry:
    - fisher_rao
    - wasserstein
    - kl_divergence
    - sinkhorn
  classical:
    - rolling_vol_z
    - cusum
    - hmm
    - bocpd
    - isolation_forest
    - garch
