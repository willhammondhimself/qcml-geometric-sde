# experiments/config.yaml — Single source of truth for all experiment parameters
#
# This file replaces hardcoded parameters scattered across regime_comparison.py,
# normalization_ablation.py, walk_forward_hpo.py, and other experiment scripts.
#
# Usage:
#   import yaml
#   with open("experiments/config.yaml") as f:
#       cfg = yaml.safe_load(f)

# ---------------------------------------------------------------------------
# Data sourcing
# ---------------------------------------------------------------------------
data:
  symbols: [SPY, DIA]
  start_date: "1995-01-01"
  end_date: "2024-12-31"
  source: yfinance      # yfinance | polygon | wrds | auto
  cache_dir: experiments/outputs/.cache
  enrichment_lookback: 20

# ---------------------------------------------------------------------------
# Crisis definitions — 16 episodes used in the comparison pipeline
# Each entry carries start/end dates, a human-readable label, and a category
# tag (conventional = well-studied in literature, novel = post-sample / rare).
# ---------------------------------------------------------------------------
crises:
  1997_asia:
    start: "1997-10-20"
    end: "1997-11-30"
    label: "Asian Crisis 1997"
    category: conventional

  1998_ltcm:
    start: "1998-08-01"
    end: "1998-10-15"
    label: "LTCM/Russia 1998"
    category: conventional

  2000_dotcom:
    start: "2000-03-10"
    end: "2000-10-09"
    label: "Dot-Com Crash 2000"
    category: conventional

  2001_911:
    start: "2001-09-10"
    end: "2001-10-15"
    label: "September 11 2001"
    category: conventional

  2007_quant:
    start: "2007-08-01"
    end: "2007-09-30"
    label: "Quant Crisis 2007"
    category: conventional

  2008_gfc:
    start: "2008-09-01"
    end: "2009-03-31"
    label: "GFC 2008"
    category: conventional

  2010_flash:
    start: "2010-05-01"
    end: "2010-06-30"
    label: "Flash Crash 2010"
    category: conventional

  2011_euro:
    start: "2011-07-01"
    end: "2011-10-31"
    label: "Euro Crisis 2011"
    category: conventional

  2015_china:
    start: "2015-07-01"
    end: "2015-09-30"
    label: "China Crash 2015"
    category: conventional

  2018_volmageddon:
    start: "2018-01-26"
    end: "2018-04-30"
    label: "Volmageddon 2018"
    category: novel

  2018_q4:
    start: "2018-10-01"
    end: "2018-12-31"
    label: "Q4 Selloff 2018"
    category: novel

  2019_repo:
    start: "2019-09-01"
    end: "2019-10-31"
    label: "Repo Crisis 2019"
    category: novel

  2020_covid:
    start: "2020-02-20"
    end: "2020-04-30"
    label: "COVID 2020"
    category: conventional

  2022_rates:
    start: "2022-01-01"
    end: "2022-10-31"
    label: "Rate Hikes 2022"
    category: novel

  2023_svb:
    start: "2023-03-01"
    end: "2023-04-30"
    label: "SVB 2023"
    category: novel

  2024_carry:
    start: "2024-07-15"
    end: "2024-08-31"
    label: "Carry Unwind 2024"
    category: novel

# ---------------------------------------------------------------------------
# Named crisis subsets — used by --quick, --full, etc. CLI flags
# ---------------------------------------------------------------------------
crisis_subsets:
  quick: [2008_gfc, 2020_covid, 2022_rates, 2023_svb]

  post_2005:
    - 2007_quant
    - 2008_gfc
    - 2010_flash
    - 2011_euro
    - 2015_china
    - 2018_volmageddon
    - 2018_q4
    - 2019_repo
    - 2020_covid
    - 2022_rates
    - 2023_svb
    - 2024_carry

  all:
    - 1997_asia
    - 1998_ltcm
    - 2000_dotcom
    - 2001_911
    - 2007_quant
    - 2008_gfc
    - 2010_flash
    - 2011_euro
    - 2015_china
    - 2018_volmageddon
    - 2018_q4
    - 2019_repo
    - 2020_covid
    - 2022_rates
    - 2023_svb
    - 2024_carry

  paper:
