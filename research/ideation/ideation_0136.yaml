id: "0136"
round: 136
timestamp: "2026-03-09T19:00:00"
question: "Can we build a tiered alerting system — fast/cheap observables for screening, expensive ones for confirmation — without losing lead time?"
theme: "scalability"
status: "keep"

hypothesis:
  statement: "Cheap Tier 1 detectors can screen daily and trigger expensive Tier 3 only when needed, preserving detection quality at 10% compute cost"
  mechanism: "The observatory has a natural computational tier structure; Tier 1 includes the #1 detector (Reduced Purity, d=0.835)"
  prior_plausibility: "high"

knight_findings:
  - knight: 1
    role: "empirical_implementation"
    workers_used: 3
    conclusion: >
      KEEP. Natural tier structure visible in core.py: Tier 1 (single eigensolve):
      spectral_gap, spectral_entropy, reduced_state_purity, full_spectrum.
      Tier 2 (eigensolve + overlaps): geometric_phase_rate, hamiltonian_sensitivity,
      hamiltonian_commutator_norm. Tier 3 (nested finite differences): ricci_scalar
      (~147 eigensolves/point at n_pca=3), sectional_curvature, geodesic_curvature.
      Crucially, Reduced Purity (Tier 1, d=0.835, rank #1) is both the cheapest
      AND the best individual detector.
    evidence: "Tier 1: O(d^3) single eigensolve; Tier 3: O(n^2 * d^3) nested FD; Reduced Purity is Tier 1 AND #1 overall"
    confidence: 0.88
    key_insight: "The #1 detector is also the cheapest. A tiered cascade is the natural deployment architecture."

  - knight: 2
    role: "practical_value"
    workers_used: 3
    conclusion: >
      KEEP. Produces a publishable 'deployment architecture' contribution.
      The lead_time_analysis.py infrastructure already exists to measure
      per-method alarm timing. The research question: does a Tier 1 screen
      lose any lead time compared to running all 26 observables? If not, the
      tiered cascade gives 90%+ detection quality at 10% compute cost. The
      Regime-Adaptive fusion from Paper 2 (d=0.774, perfect generalization)
      provides the 'compute everything' upper bound for comparison.
    evidence: "lead_time_analysis.py exists; Regime-Adaptive as upper bound; 90% quality at 10% cost"
    confidence: 0.85
    key_insight: "Combines detection theory with computational cost analysis — genuine research contribution."

  - knight: 3
    role: "failure_mode_analysis"
    workers_used: 2
    conclusion: >
      CONDITIONAL KEEP. Two risks: (1) If Tier 1 alarms lag behind Tier 3 by
      more than 5 days, the cascade adds detection latency. (2) The Tier 1
      false alarm rate may force too-frequent Tier 3 activation, reducing the
      compute savings. Both are empirically testable from existing data via
      lead_time_analysis.py. The mitigation: use Tier 1 OR (Tier 2 with
      weekly frequency) as the screen, reserving Tier 3 for confirmation.
    evidence: "Testable via lead_time_analysis.py; worst case: weekly Tier 2 as backup screen"
    confidence: 0.80
    key_insight: "Empirically testable risks with clear mitigation strategy."

