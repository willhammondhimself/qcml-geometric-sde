    workers_used: 0
    conclusion: >
      Channel-PCA interpretation (retain d ~ 2-4 components of 16 channels) would
      destroy the complementarity that justifies fusion. Friedman p=0.538 means no
      single method dominates — all 16 channels contribute. Reducing to 3 channels
      eliminates 80% of the fusion input.
    evidence: "Friedman p=0.538 confirms no method dominates — all channels needed"
    confidence: 0.80
    key_insight: "Dimension-based channel reduction destroys the complementarity that makes fusion work"

  - knight: 3
