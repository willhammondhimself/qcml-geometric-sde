    workers_used: 0
    conclusion: >
      CATEGORY ERROR — more severe than Q0108. Tangent subspace is R^d subset of R^8
      (feature space). Score matrix is (T, 16) in channel space. Cannot project a
      16-dimensional score vector onto a d-dimensional subspace of R^8. Any interpretation
      either changes the question to trivial PCA on scores (using d from data PCA to
      truncate channel PCA) or requires re-computing all observables on projected data
      (doubling cost with no mathematical justification).
    evidence: "dim(tangent subspace) ⊂ R^8, dim(score matrix) ⊂ R^16 — incompatible spaces"
    confidence: 0.85
    key_insight: "Projection across incompatible vector spaces is mathematically undefined"

  - knight: 2
