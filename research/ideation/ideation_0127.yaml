id: "0127"
round: 127
timestamp: "2026-03-09T16:00:00"
question: "Does the quantum relative entropy D(rho_t || rho_ref) between current and long-term average state outperform fidelity-based measures?"
theme: "novel_observables_ii"
status: "keep"

hypothesis:
  statement: "Quantum relative entropy D(|psi_t><psi_t| || rho_ref) detects how 'surprising' the current state is relative to the historical ensemble"
  mechanism: "During crises, states deviate from the long-run average into unexplored eigendirections, causing D to spike via log-sensitivity to small eigenvalues"
  prior_plausibility: "medium"

knight_findings:
  - knight: 1
    role: "theoretical_validity"
    workers_used: 4
    conclusion: >
      WEAK REJECT. For pure-vs-pure states, D = -log|<psi|phi>|^2 is an exact
      monotone transform of fidelity (Spearman = 1.0 after z-scoring). For
      pure-vs-mixed (rho_ref = time-averaged density matrix), D decomposes into
      (a) spread of rho_ref (captured by ESD) and (b) atypicality of psi_t
      (partially captured by MLF). The genuine novelty — coupling between current
      state projection and historical eigenstructure via log weighting — is real
      but narrow. Numerically sensitive to small eigenvalues of rho_ref.
    evidence: "D(pure||pure) = -log F (monotone of fidelity); D(pure||mixed) = -sum_i p_i log(lambda_i); well-defined for d=8, W>=8 (full rank)"
    confidence: 0.92
    key_insight: "Pure-vs-pure is provably redundant with fidelity. Pure-vs-mixed has marginal novelty via log-eigenvalue sensitivity."

  - knight: 2
    role: "empirical_implementation"
    workers_used: 1
    conclusion: >
      STRONG POSITIVE for expanding window variant. D_expanding: median d=1.578
      (GFC 1.190, COVID 2.236, Rates 1.967, SVB 0.887) — ALL 4 crises above d=0.8.
      Would rank top 3-5 in the full observatory. Correlation with MLF: rho=0.495
      (passes orthogonality gate). Rolling variants are weaker: D_W20 d=0.316,
      D_W60 d=0.775. Simple infidelity at W=20 (d=0.555) DOMINATES D_W20 (d=0.316).
      The expanding window succeeds because rho_ref is always well-conditioned
      (full rank, all eigenvalues substantial) and encodes the entire history.
    evidence: "D_expanding: d=1.19/2.24/1.97/0.89, median=1.578; rho(D_expanding, MLF)=0.495; D_W20 vs infidelity: 0.316 vs 0.555"
    confidence: 0.90
    key_insight: "D_expanding is exceptional (d=1.578) and NOT redundant with MLF (rho=0.495). Rolling variants are weak and redundant."

  - knight: 3
    role: "comparative_analysis"
    workers_used: 6
    conclusion: >
      CONDITIONAL POSITIVE. QRE adds a genuinely new mathematical channel (tail
      sensitivity to low-eigenvalue directions of rho_ref). Low expected correlation
      with Reduced Purity (rho~0.20) — good fusion partner with the #1 detector.
      Moderate redundancy with MLF (rho~0.55-0.70 predicted, 0.495 measured for
      expanding). Expected to land in 0.45-0.55 tier for standalone detection, but
      expanding window variant significantly exceeds this prediction. Prototype
      implementation already exists — zero implementation cost for benchmark run.
    evidence: "Expected rho vs Reduced Purity: 0.20; vs MLF: 0.55-0.70; vs ESD: 0.40-0.55; prototype exists"
    confidence: 0.78
    key_insight: "Low correlation with Reduced Purity (rho~0.20) makes QRE a valuable fusion partner despite moderate standalone performance"

  - knight: 4
    role: "failure_mode_analysis"
    workers_used: 0
    conclusion: >
      REJECT for rolling window variants. Spearman 0.979 with infidelity on
      synthetic QCML-like states (rolling W=20). Epsilon sensitivity catastrophic
      when rank-deficient (5.34x variation). Log transform amplifies noise from small
      eigenvalues (up to 92,000x). D underperforms infidelity (d=2.07 vs 2.33) on
      synthetic data. Three researcher DoF (W, epsilon, window_type). However, these
      concerns are MITIGATED for the expanding window variant: always full rank,
      better conditioned, and shows rho=0.495 with MLF on real data (vs 0.979 on
      synthetic rolling data).
    evidence: "Spearman(D, infidelity)=0.979 (rolling, synthetic); eps variation 5.34x (rank-deficient); cond=954 during crisis clustering"
    confidence: 0.91
    key_insight: "Rolling window failures are severe but expanding window mitigates most concerns (full rank, well-conditioned)"

