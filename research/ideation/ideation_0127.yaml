verdict:
  keep: true
  reason: >
    The expanding-window variant D_expanding is exceptional: median d=1.578 with ALL
    4 crises above d=0.8 (GFC 1.19, COVID 2.24, Rates 1.97, SVB 0.89). This would
    rank top 3-5 in the full observatory. Crucially, D_expanding has rho=0.495 with
    Multi-Lag Fidelity (passes orthogonality gate) and expected rho~0.20 with Reduced
    Purity (good fusion partner with the #1 detector). The expanding window mitigates
    Knight 4's failure mode concerns: always full rank for W > d=8, well-conditioned
    eigenvalues, no epsilon sensitivity. Rolling window variants are REJECTED — they
    are redundant with infidelity (rho=0.973) and numerically unstable. The theoretical
    concern (Knight 1) about decomposition into ESD + MLF components is valid but
    empirically the combined signal outperforms both individually, suggesting the
    coupling between eigenstructure and state projection carries genuine information.
  strength: "high"
  recommended_variant: "expanding_window"
  follow_up_questions:
    - "Does D_expanding maintain d>0.8 on the full 17-crisis benchmark?"
    - "What is the actual Spearman correlation between D_expanding and Reduced Purity on real data?"
    - "Can D_expanding be made O(d^2) per update via incremental rank-1 updates to rho_ref?"
    - "Is the expanding window's strong performance driven by growing reference stability or genuine log-sensitivity?"

