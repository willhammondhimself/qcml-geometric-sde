question: "What is the minimum viable observatory — fewest observables that maintain aggregate d > 0.5 across all crisis types?"
theme: "scalability"
status: "keep"

hypothesis:
  statement: "A small subset of observables (3-5) can cover all crisis types with aggregate d > 0.5"
  mechanism: "Crisis type specialization means different observables excel at different crises; greedy set cover finds minimal covering set"
  prior_plausibility: "high"

knight_findings:
  - knight: 1
    role: "empirical_implementation"
    workers_used: 2
    conclusion: >
      KEEP. The 44-method x 17-crisis Cohen's d matrix in the canonical JSON
      provides the complete data for greedy set cover optimization: find the
      smallest subset S such that for every crisis c, max_{m in S} d(m,c) > 0.5.
      The regime-adaptive fusion from Paper 2 already uses 4 methods (Spectral
      Entropy, Dim Collapse, QCML Chern, Reduced Purity), but these were
      optimized for fusion score, not minimum coverage. A formal minimum-set
      analysis would: (1) quantify coverage vs cardinality tradeoff, (2) identify
      'hard' crises requiring specialized detectors, (3) provide principled
      deployment recommendation.
    evidence: "44x17 d-matrix available; regime-adaptive uses 4 methods; greedy set cover is standard optimization"
    confidence: 0.85
    key_insight: "Well-posed set cover problem solvable from existing data. No new experiments needed."

  - knight: 2
    role: "practical_value"
    workers_used: 2
    conclusion: >
      MEDIUM VALUE. Produces a useful practitioner-facing result (minimum
      detector count for coverage) and complements the Paper 2 regime-adaptive
      fusion. This is an engineering/analysis task rather than a fundamental
      research contribution, but it provides deployment guidance and identifies
      indispensable geometric channels. The coverage-vs-cardinality curve is
      a clean, publishable figure.
    evidence: "Deployment guidance output; coverage curve figure; complements Paper 2 fusion"
    confidence: 0.80
    key_insight: "Straightforward optimization over existing data — useful but not a theorem-level contribution."

