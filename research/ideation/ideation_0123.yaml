question: "Does the nearest-neighbor level spacing ratio (random matrix theory GOE/GUE/Poisson classification) change at crisis onset?"
theme: "novel_observables_ii"
status: "keep"

hypothesis:
  statement: "Level spacing ratio <r> classifies spectral statistics (GOE/GUE/Poisson), and crisis-era Hamiltonians shift toward Poisson-like (integrable) spectra"
  mechanism: "During crises, correlation convergence reduces effective degrees of freedom, making the Hamiltonian more integrable and level repulsion weaker"
  prior_plausibility: "medium"

knight_findings:
  - knight: 1
    role: "theoretical_validity"
    workers_used: 0
    conclusion: >
      Captures second-order spectral correlations beyond first-order observables
      (spectral gap, spectral entropy). Well-motivated: crisis → fewer effective
      DoF → more integrable spectrum → <r> drops toward Poisson (0.386). For
      d=8, there are 6 consecutive ratios per time step — marginal but viable
      with rolling-window averaging. GUE class expected for 'random' operators
      (complex Hermitian). Parameter-free once basis is fixed.
    evidence: "RMT reference values: Poisson 0.386, GOE 0.531, GUE 0.600; d=8 gives 6 ratios"
    confidence: 0.72
    key_insight: "Second-order spectral statistic distinct from first-order (gap, entropy) — captures level repulsion, not just level distribution"

  - knight: 2
    role: "empirical_implementation"
    workers_used: 1
    conclusion: >
      EXCEPTIONALLY STRONG SIGNAL. Mean ratio variant: median d=2.00 across
      4 smoke crises (GFC 2.88, COVID 3.00, Rates 1.11, SVB -0.57). Poisson
      fraction even stronger for systemic crises (GFC 3.51, COVID 3.69) but
      weaker for rates (0.27). Std ratio moderate (median d=0.74). Overall
      mean <r>=0.684 exceeds GUE (0.600) — expected for random Hermitian
      operators in finite dimension. SVB shows NEGATIVE d across all variants,
      indicating level repulsion INCREASED — qualitatively different from
      systemic crises. Computation: ~0.2s for 5013 time steps.
    evidence: "mean_ratio: d=2.88/3.00/1.11/-0.57 median=2.00; poisson_fraction: d=3.51/3.69/0.27/-0.13 median=1.89"
    confidence: 0.88
    key_insight: "Strongest signal seen in ideation so far (d=2.00). SVB negative-d distinguishes localized vs systemic crises."

  - knight: 3
    role: "comparative_analysis"
    workers_used: 6
    conclusion: >
      Expected redundancy with existing spectral cluster (Spectral Entropy,
      Spectral Gap, Spectral Complexity). Averaging over all eigenvalue gaps
      dilutes the ground-state gap signal that SpectralGapDetector already
      captures. At d=8, only 6 ratios per time step — small-N statistics.
      However, the MAGNITUDE of the signal (d=2.00) far exceeds any existing
      spectral observable (Spectral Entropy d=0.530, Spectral Gap d≈0.3).
      The redundancy concern is real but secondary given the effect size.
    evidence: "Expected r~0.7-0.8 with Spectral Entropy; but d=2.00 vs d=0.530 — 4x larger effect"
    confidence: 0.70
    key_insight: "Redundancy concern valid but dwarfed by effect size — 4x larger than best existing spectral observable"

  - knight: 4
    role: "failure_mode_analysis"
    workers_used: 0
    conclusion: >
      Must use operator_method='random' — pca_inspired is fatal (Kramers
      degeneracy produces only 2 usable ratios from d=8). Medium severity
      concern: 6 ratios per time step is marginal for RMT classification,
      but rolling-window averaging (60-day default) mitigates this. Low
      overfitting risk (parameter-free statistic). Low data leakage risk
      (uses only past data in expanding window). The negative-d for SVB
      should not be treated as a failure — it reveals different crisis types.
    evidence: "pca_inspired: only 2 usable ratios (fatal); random: 6 ratios per step; rolling window mitigates small-N"
    confidence: 0.85
    key_insight: "pca_inspired is fatal for this observable. random operators with rolling window averaging is the correct approach."

