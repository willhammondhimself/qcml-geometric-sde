verdict:
  keep: true
  reason: >
    SPECIALIST DETECTOR — exceptional on systemic crises, weak on localized ones.
    Full 18-crisis benchmark: mean_ratio median d=0.500 (mean=0.905), highly
    bimodal. Systemic crises show extraordinary effect sizes (GFC d=3.27, COVID
    d=3.44, LTCM d=2.25, 9/11 d=1.18, Euro d=1.33) while localized crises show
    near-zero (flash crash d=0.07, repo d=0.08, carry d=0.17). The poisson_fraction
    variant is even more extreme: GFC d=5.91, COVID d=6.27 — the largest effect
    sizes in the entire observatory — but median d=0.37 across all crises. The
    smoke test median (d=2.00) was inflated by oversampling systemic crises (3/4
    smoke crises were systemic). Computation remains trivial (0.3s), parameter-free,
    and theoretically grounded in RMT. The bimodal response is itself scientifically
    interesting: level spacing ratio may be a systemic-crisis-specific detector,
    complementary to rate-driven-crisis detectors like Reduced Purity. Must use
    operator_method='random' (pca_inspired fatal).
  strength: "high"
  recommended_variant: "mean_ratio"
  crisis_specialization: "systemic (GFC/COVID/LTCM/9-11/Euro) — NOT rate/localized"
