hypothesis:
  statement: "GPU-batched eigensolves provide meaningful speedup for the QCML pipeline"
  mechanism: "Batching many small eigensolves on GPU amortizes kernel launch overhead"
  prior_plausibility: "low"

knight_findings:
  - knight: 1
    role: "empirical_implementation"
    workers_used: 2
    conclusion: >
      REJECT. At d <= 16, individual eigensolves cost microseconds on CPU.
      GPU kernel launch overhead alone is 10-50us, making GPU SLOWER for
      individual calls. Batching 500 assets' eigensolves together could
      amortize launch overhead, but the real bottleneck is the nested
      finite-difference structure: ricci_scalar calls _christoffel_symbols
      (2n+1) times, each calling quantum_metric n times, each calling
      quasi_coherent_state (2n+1) times. For n_pca=3, that is 7 * 3 * 7 = 147
      eigensolves per point — the scaling is in the COUNT of eigensolves, not
      their individual cost.
    evidence: "eigh(8x8)=8.5us; GPU launch overhead=10-50us; 147 eigensolves/point for Ricci"
    confidence: 0.92
    key_insight: "GPU slower than CPU for individual d<=16 eigensolves. Bottleneck is nested FD structure."

  - knight: 2
    role: "practical_value"
    workers_used: 2
    conclusion: >
      REJECT. Sub-second latency for 500+ assets is a production/trading
      concern, while the paper focuses on statistical rigor and reproducibility.
      This is engineering work that does not produce a publishable result. GPU
      would help at d >= 32 where matrix ops dominate, but the paper uses
      d <= 16.
    evidence: "Production concern, not research contribution; GPU wins only at d>=32"
    confidence: 0.90
    key_insight: "Engineering optimization, not research. The publishable alternative is analytical Christoffel symbols."

