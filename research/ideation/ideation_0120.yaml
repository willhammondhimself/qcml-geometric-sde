  reason: "Theoretically elegant but circular dependency (need dim to estimate d, need d to set dim) and operator refitting discontinuities make this impractical. The simplest version (PCA variance ratio → hilbert_dim at refit) doesn't need QCML dimension estimation."
  strength: "low"
  follow_up_questions:
    - "Does PCA-guided adaptive hilbert_dim improve detection in an ablation study?"

