      2023_svb: 0.097
    infidelity_proxy:
      2008_gfc: 0.757
      2020_covid: 0.369
      2022_rates: 0.834
      2023_svb: 0.132
  aggregate_d_nielsen_zero: 0.423
  aggregate_d_infidelity: 0.649
  aggregate_d_calm_ref: 0.028
  correlation_with_mlf: -0.013
  passes_threshold: false

verdict:
  keep: false
  reason: >
    Mathematical death sentence: ||log(U_min)||_F = sqrt(2) * d_FS for pure states
    (proved analytically, verified numerically). Circuit complexity is literally a
    constant multiple of Fubini-Study distance, already captured by GeodesicVelocity,
    MultiLagFidelity, and SpeedLimitRatio. Empirically weak (d=0.423), dominated by
    trivial infidelity proxy (d=0.649 ≈ Multi-Lag Fidelity). Reference state choice
    is a severe researcher DoF: fixed references saturate, adaptive references leak
    labels. The one genuinely novel component (non-commutative path accumulation)
    has corrections of O(d_FS^2) — too small for financial data.
  strength: "high"
  follow_up_questions:
    - "For mixed states (density matrices), does circuit complexity become genuinely distinct from d_FS?"
    - "Can the non-commutative path accumulation be isolated and tested directly as a standalone observable?"

