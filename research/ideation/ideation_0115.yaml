  passes_threshold: false

verdict:
  keep: true
  reason: "Defensible interpretation: rank(g) counts state-sensitive directions, which approximate risk factors for well-calibrated operators. Weak with random operators (generically full rank). Useful theoretical discussion point."
  strength: "low"
