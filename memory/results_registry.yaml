# Results Registry: maps every claimed number in the paper to source data.
#
# Each claim has:
#   name:         Human-readable description of the claim
#   section:      Paper section where this number appears
#   paper_value:  The value as written in the paper
#   source_json:  Path to source JSON (relative to repo root)
#   json_path:    Dot-notation path to the value in the JSON
#
# Canonical runs:
#   Main comparison: 2026-03-03, 36 methods x 17 crises
#   Fusion full:     2026-03-04, 22 methods x 15 crises (15 individuals + 7 fusion)
#   Fusion holdout:  2026-03-04, 22 methods x 4 crises
#
# Run: python scripts/verify_paper_numbers.py
#
# Tolerance for numeric comparisons (default 0.02 for Cohen's d values).
tolerance: 0.02

claims:
  # --- Table 4: Main comparison (median d, 36 methods x 17 crises) ---
  - name: "Reduced Purity median d"
    section: "Abstract / Table 4 / Sec 5.1"
    paper_value: 0.83
    source_json: "experiments/outputs/regime_detection/causal_comparison_20260303_231013.json"
    json_path: "summary.median_d.Reduced Purity"

  - name: "Hamilton MS median d"
    section: "Abstract / Table 4 / Sec 5.1"
    paper_value: 0.71
    source_json: "experiments/outputs/regime_detection/causal_comparison_20260303_231013.json"
