    paper_value: 0.63
    source_json: "experiments/outputs/regime_detection/causal_comparison_20260311_010639.json"
    json_path: "summary.median_d.CUSUM"
    verified: true

  - name: "Berry Phase Rate median d"
    section: "Sec 5.1"
    paper_value: 0.61
    source_json: "experiments/outputs/regime_detection/causal_comparison_20260311_010639.json"
    json_path: "summary.median_d.Berry Phase Rate"
    verified: true

  - name: "Random Forest median d"
    section: "Sec 5.1"
    paper_value: 0.36
    source_json: "experiments/outputs/regime_detection/causal_comparison_20260311_010639.json"
    json_path: "summary.median_d.Random Forest"
    verified: true

  - name: "GARCH(1,1) median d"
    section: "Sec 5.1"
    paper_value: 0.27
    source_json: "experiments/outputs/regime_detection/causal_comparison_20260311_010639.json"
    json_path: "summary.median_d.GARCH(1,1)"
    verified: true

  # --- Friedman test (main comparison) ---
  # Note: tolerance=0.02 is for Cohen's d; chi-sq values need wider tolerance.
  - name: "Friedman chi-squared (main)"
    section: "Sec 5.1"
    paper_value: 233.13
    source_json: "experiments/outputs/regime_detection/causal_comparison_20260311_010639.json"
    json_path: "summary.friedman_chi_sq"
    verified: true

  # --- Per-crisis d-values (walk-forward table, spot checks) ---
  - name: "Berry Phase Rate d on 2008 GFC"
    section: "Walk-forward table"
    paper_value: 0.54
    source_json: "experiments/outputs/regime_detection/causal_comparison_20260311_010639.json"
    json_path: "results.Berry Phase Rate.2008_gfc.d"
    verified: true

  - name: "QFI Determinant d on 2008 GFC"
    section: "Walk-forward table"
    paper_value: 1.73
    source_json: "experiments/outputs/regime_detection/causal_comparison_20260311_010639.json"
    json_path: "results.QFI Determinant.2008_gfc.d"
    verified: true

